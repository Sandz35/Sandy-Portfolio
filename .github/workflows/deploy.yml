name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub sign in to AWS without stored keys (OIDC)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed JS/CSS files can be cached for a year; everything else is re-checked on every visit.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --exclude "assets/*" --cache-control "public,max-age=0,must-revalidate" --delete

      - name: Clear CloudFront cache for the non-hashed files
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/" "/resume.pdf" "/images/*" "/favicon.svg"